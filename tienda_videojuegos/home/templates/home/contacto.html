{% extends "base.html" %}
{% load static %}

{% block title %}Tienda de Videojuegos - Contacto{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center text-body mb-4">Contacto</h1>
    <p class="text-center text-body">Si tienes alguna pregunta o comentario, no dudes en contactarnos a través del siguiente formulario:</p>
    <div class="row justify-content-center text-body mt-5">
        <div class="col-md-6">
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Tu correo electrónico">
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
